<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>社团列表 | 校园生活</title>
   <link href="https://cdn.staticfile.net/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/campus/clubs/">校园生活</a>
        <div class="navbar-nav">
            <a class="nav-link active" href="/campus/clubs/">社团</a>
            <a class="nav-link" href="/campus/activities/">活动</a>
            <a class="nav-link" href="/campus/my-signups/">我的报名</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2 class="mb-4">社团一览</h2>
    <div class="row">
        {% for club in clubs %}
        <div class="col-md-4 mb-4">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">{{ club.name }}</h5>
                    <p class="card-text text-muted small">
                        {{ club.description|default:"暂无简介" }}
                    </p>
                    <p class="card-text">
                        <small>负责人：{{ club.leader.username|default:"待定" }}</small><br>
                        <small>成立：{{ club.founded_date|date:"Y-m-d" }}</small>
                    </p>
                    {% if club.is_active %}
                        <span class="badge bg-success">招新中</span>
                    {% else %}
                        <span class="badge bg-secondary">暂停招新</span>
                    {% endif %}
                </div>
                <div class="card-footer">
                    <a href="/campus/activities/?club={{ club.id }}"
                       class="btn btn-sm btn-outline-primary">查看活动</a>
                </div>
            </div>
        </div>
        {% empty %}
            <p class="text-muted">暂无社团数据</p>
        {% endfor %}
    </div>
</div>
</body>
</html>
